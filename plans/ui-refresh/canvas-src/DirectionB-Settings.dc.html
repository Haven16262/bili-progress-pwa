<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #7dd3fc; } a:hover { color: #bae6fd; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; color: #f4f2fb;
     font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
     background:
       radial-gradient(120% 80% at 12% 0%, rgba(129,90,240,0.42), transparent 55%),
       radial-gradient(120% 90% at 92% 12%, rgba(56,120,230,0.36), transparent 52%),
       radial-gradient(140% 100% at 60% 100%, rgba(168,85,247,0.30), transparent 55%),
       #10101c;">

  <div style="padding: 30px 22px 18px; font-family: 'Manrope', sans-serif; font-size: 26px;
       font-weight: 800; letter-spacing: -0.02em;">设置</div>

  <div style="display: flex; flex-direction: column; gap: 14px; padding: 4px 20px 0;">

    <div style="background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14); border-radius: 24px;
         backdrop-filter: blur(18px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.2); padding: 18px;">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
        <div style="font-size: 14px; font-weight: 700;">B 站 Cookie (SESSDATA)</div>
        <span style="font-size: 11px; padding: 3px 10px; border-radius: 999px; color: #4ade80;
             background: rgba(74,222,128,0.16); border: 1px solid rgba(74,222,128,0.3);">已设置</span>
      </div>
      <div style="font-size: 11.5px; color: rgba(244,242,251,0.6); line-height: 1.6; margin-bottom: 14px;">
        F12 → Application → Cookies → 复制 SESSDATA 的值。有效期约半年。</div>
      <div style="display: flex; gap: 10px;">
        <div style="flex: 1; padding: 11px 13px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.16);
             border-radius: 14px; font-size: 13px; color: rgba(244,242,251,0.4);">粘贴 SESSDATA…</div>
        <button style="padding: 0 18px; border: 1px solid rgba(255,255,255,0.25); border-radius: 14px;
             background: rgba(255,255,255,0.16); color: #fff; font-size: 13px; font-weight: 700;">保存</button>
      </div>
    </div>

    <div style="background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14); border-radius: 24px;
         backdrop-filter: blur(18px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.2); padding: 18px;">
      <div style="font-size: 14px; font-weight: 700; margin-bottom: 16px;">每行显示数量</div>
      <div style="display: flex; align-items: center; gap: 14px;">
        <div style="flex: 1; height: 6px; border-radius: 999px; background: rgba(255,255,255,0.14); position: relative;">
          <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 45%; border-radius: 999px;
               background: linear-gradient(90deg, #7dd3fc, #a78bfa);"></div>
          <div style="position: absolute; left: 45%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px;
               border-radius: 50%; background: #fff; box-shadow: 0 3px 10px rgba(0,0,0,0.35);"></div>
        </div>
        <span style="font-family: 'Manrope', sans-serif; font-size: 15px; width: 18px; text-align: center;">3</span>
      </div>
    </div>

    <div style="background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14); border-radius: 24px;
         backdrop-filter: blur(18px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.2); padding: 18px;">
      <div style="font-size: 14px; font-weight: 700; margin-bottom: 10px;">数据同步</div>
      <div style="font-size: 11.5px; color: rgba(244,242,251,0.6); line-height: 1.6; margin-bottom: 14px;">
        上次同步：<span style="color: #4ade80;">成功</span> · 9/2 03:07 · 更新 4 个视频</div>
      <button style="padding: 11px 22px; border: 1px solid rgba(255,255,255,0.25); border-radius: 14px;
           background: rgba(255,255,255,0.16); color: #fff; font-size: 13px; font-weight: 700;">立即同步</button>
      <div style="margin-top: 10px; font-size: 11px; color: rgba(244,242,251,0.4);">定时任务每天 03:07 自动执行</div>
    </div>

    <div style="background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14); border-radius: 24px;
         backdrop-filter: blur(18px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.2); padding: 18px;
         display: flex; align-items: center; justify-content: space-between;">
      <div style="font-size: 14px; font-weight: 700;">已观看完视频</div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(244,242,251,0.6)" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </div>

    <div style="background: rgba(255,255,255,0.04); border-radius: 24px; padding: 16px 18px;
         font-size: 11px; color: rgba(244,242,251,0.42); line-height: 1.7;">
      Bili Progress PWA v1.0<br>进度以 B 站为准，名称与置顶以本地为准<br>进度 100% 持续 3 天后自动归档
    </div>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 18px; display: flex; border-radius: 22px;
       background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.16);
       backdrop-filter: blur(20px); box-shadow: 0 12px 32px rgba(0,0,0,0.3); padding: 12px 0;">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: rgba(255,255,255,0.5);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span style="font-size: 10.5px;">主页</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #fff;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      <span style="font-size: 10.5px;">设置</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
