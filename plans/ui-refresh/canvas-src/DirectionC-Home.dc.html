<!doctype html>
<html>

<body>
<x-dc>

  <style>
    body { margin: 0; }
    a { color: #3f8fc4; } a:hover { color: #2f6f9c; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; color: #2b2a33;

  <!-- Header -->

         box-shadow: 0 6px 16px rgba(123,211,166,0.5);">+</button>
  </div>

             background: linear-gradient(180deg, #b98ff0, #9a63e6);"></div>
        <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
             font-family: 'Fredoka', sans-serif; font-size: 21px; font-weight: 600; color: #fff;
             text-shadow: 0 1px 4px rgba(0,0,0,0.28);">94%</div>
      </div>
      <div style="font-size: 11.5px; font-weight: 700; color: #6b6875; max-width: 120px; text-align: center;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Rust 所有权 · 第 3 讲</div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px 12px 14px;

      <div style="position: relative; width: 88px; height: 138px; border: 2px solid #e7e3da; border-top: none;

        <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 62%;
             background: linear-gradient(180deg, #9d8bf2, #7a63e0);"></div>
        <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
             font-family: 'Fredoka', sans-serif; font-size: 21px; font-weight: 600; color: #fff;
             text-shadow: 0 1px 4px rgba(0,0,0,0.28);">62%</div>
      </div>
      <div style="font-size: 11.5px; font-weight: 700; color: #6b6875; max-width: 120px; text-align: center;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">现代宇宙学 Ep.7</div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px 12px 14px;

      <div style="position: relative; width: 88px; height: 138px; border: 2px solid #e7e3da; border-top: none;
           border-radius: 6px 6px 30px 30px; overflow: hidden; background: #f3f0e8;">
        <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 38%;
             background: linear-gradient(180deg, #7bb8ea, #4f97dc);"></div>

             font-family: 'Fredoka', sans-serif; font-size: 21px; font-weight: 600; color: #fff;
             text-shadow: 0 1px 4px rgba(0,0,0,0.28);">38%</div>
      </div>
      <div style="font-size: 11.5px; font-weight: 700; color: #6b6875; max-width: 120px; text-align: center;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Linux 内核导读</div>

             background: linear-gradient(180deg, #5ec8d8, #33a7bc);"></div>

             font-family: 'Fredoka', sans-serif; font-size: 21px; font-weight: 600; color: #fff;
             text-shadow: 0 1px 4px rgba(0,0,0,0.28);">21%</div>
      </div>
      <div style="font-size: 11.5px; font-weight: 700; color: #6b6875; max-width: 120px; text-align: center;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">数据库系统 15-445</div>

  <!-- Bottom nav -->

       background: #ffffff; box-shadow: 0 8px 24px rgba(43,42,51,0.12); padding: 12px 0;">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #4aa87e;">
