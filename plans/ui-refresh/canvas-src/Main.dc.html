<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #7dd3fc; } a:hover { color: #bae6fd; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; color: #f4f2fb;
     font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
     background:
       radial-gradient(120% 80% at 12% 0%, rgba(129,90,240,0.42), transparent 55%),
       radial-gradient(120% 90% at 92% 12%, rgba(56,120,230,0.36), transparent 52%),
       radial-gradient(140% 100% at 60% 100%, rgba(168,85,247,0.30), transparent 55%),
       #10101c;">

  <!-- Header -->
  <div style="display: flex; align-items: flex-start; justify-content: space-between; padding: 30px 22px 20px;">
    <div>
      <div style="font-family: 'Manrope', sans-serif; font-size: 26px; font-weight: 800;
           letter-spacing: -0.02em;">观看进度</div>
      <div style="margin-top: 7px; font-size: 12.5px; color: rgba(244,242,251,0.6);">
        6 个视频 · 平均 50%</div>
    </div>
    <button style="width: 42px; height: 42px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.25); cursor: pointer;
         background: rgba(255,255,255,0.14); backdrop-filter: blur(14px); color: #fff; font-size: 22px; font-weight: 600;
         line-height: 1; box-shadow: 0 8px 24px rgba(0,0,0,0.25);">+</button>
  </div>

  <!-- Cup grid -->
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 16px; padding: 12px 20px 0;">

    <!-- cup: glassy panel + color bloom behind -->
    <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 11px;
         padding: 16px 10px 14px; border-radius: 24px;
         background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14);
         backdrop-filter: blur(18px); box-shadow: 0 10px 30px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.22);">
      <div style="position: absolute; left: 50%; top: 40%; width: 130px; height: 130px; transform: translate(-50%,-50%);
           background: radial-gradient(circle, rgba(168,85,247,0.55), transparent 70%); filter: blur(6px);"></div>
      <div style="position: relative; width: 84px; height: 132px; border: 1px solid rgba(255,255,255,0.3);
           border-top: none; border-radius: 4px 4px 26px 26px; overflow: hidden;
           background: rgba(255,255,255,0.06);">
        <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 94%;
             background: linear-gradient(180deg, rgba(196,142,255,0.95), rgba(147,51,234,0.95));"></div>
        <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
             font-family: 'Manrope', sans-serif; font-size: 19px; font-weight: 700; color: #fff;
             text-shadow: 0 1px 6px rgba(0,0,0,0.4);">94%</div>
      </div>
      <div style="position: relative; font-size: 11px; color: rgba(244,242,251,0.78); max-width: 118px;
           text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Rust 所有权 · 第 3 讲</div>
    </div>

    <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 11px;
         padding: 16px 10px 14px; border-radius: 24px;
         background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14);
         backdrop-filter: blur(18px); box-shadow: 0 10px 30px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.22);">
      <div style="position: absolute; left: 50%; top: 40%; width: 130px; height: 130px; transform: translate(-50%,-50%);
           background: radial-gradient(circle, rgba(139,92,246,0.5), transparent 70%); filter: blur(6px);"></div>
      <div style="position: relative; width: 84px; height: 132px; border: 1px solid rgba(255,255,255,0.3);
           border-top: none; border-radius: 4px 4px 26px 26px; overflow: hidden; background: rgba(255,255,255,0.06);">
        <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 62%;
             background: linear-gradient(180deg, rgba(167,139,250,0.95), rgba(124,58,237,0.95));"></div>
        <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
             font-family: 'Manrope', sans-serif; font-size: 19px; font-weight: 700; color: #fff;
             text-shadow: 0 1px 6px rgba(0,0,0,0.4);">62%</div>
      </div>
      <div style="position: relative; font-size: 11px; color: rgba(244,242,251,0.78); max-width: 118px;
           text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">现代宇宙学 Ep.7</div>
    </div>

    <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 11px;
         padding: 16px 10px 14px; border-radius: 24px;
         background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14);
         backdrop-filter: blur(18px); box-shadow: 0 10px 30px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.22);">
      <div style="position: absolute; left: 50%; top: 40%; width: 130px; height: 130px; transform: translate(-50%,-50%);
           background: radial-gradient(circle, rgba(59,130,246,0.5), transparent 70%); filter: blur(6px);"></div>
      <div style="position: relative; width: 84px; height: 132px; border: 1px solid rgba(255,255,255,0.3);
           border-top: none; border-radius: 4px 4px 26px 26px; overflow: hidden; background: rgba(255,255,255,0.06);">
        <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 38%;
             background: linear-gradient(180deg, rgba(96,165,250,0.95), rgba(37,99,235,0.95));"></div>
        <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
             font-family: 'Manrope', sans-serif; font-size: 19px; font-weight: 700; color: #fff;
             text-shadow: 0 1px 6px rgba(0,0,0,0.4);">38%</div>
      </div>
      <div style="position: relative; font-size: 11px; color: rgba(244,242,251,0.78); max-width: 118px;
           text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Linux 内核导读</div>
    </div>

    <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 11px;
         padding: 16px 10px 14px; border-radius: 24px;
         background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14);
         backdrop-filter: blur(18px); box-shadow: 0 10px 30px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.22);">
      <div style="position: absolute; left: 50%; top: 40%; width: 130px; height: 130px; transform: translate(-50%,-50%);
           background: radial-gradient(circle, rgba(6,182,212,0.5), transparent 70%); filter: blur(6px);"></div>
      <div style="position: relative; width: 84px; height: 132px; border: 1px solid rgba(255,255,255,0.3);
           border-top: none; border-radius: 4px 4px 26px 26px; overflow: hidden; background: rgba(255,255,255,0.06);">
        <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 21%;
             background: linear-gradient(180deg, rgba(34,211,238,0.95), rgba(8,145,178,0.95));"></div>
        <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
             font-family: 'Manrope', sans-serif; font-size: 19px; font-weight: 700; color: #fff;
             text-shadow: 0 1px 6px rgba(0,0,0,0.4);">21%</div>
      </div>
      <div style="position: relative; font-size: 11px; color: rgba(244,242,251,0.78); max-width: 118px;
           text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">数据库系统 15-445</div>
    </div>
  </div>

  <!-- Bottom nav (glass) -->
  <div style="position: absolute; left: 16px; right: 16px; bottom: 18px; display: flex; border-radius: 22px;
       background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.16);
       backdrop-filter: blur(20px); box-shadow: 0 12px 32px rgba(0,0,0,0.3); padding: 12px 0;">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #fff;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span style="font-size: 10.5px;">主页</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: rgba(255,255,255,0.5);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      <span style="font-size: 10.5px;">设置</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
