<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #34d3c0; } a:hover { color: #5fe0d0; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden;
     background: #0c0e13; color: #eef1f5;
     font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">

  <div style="padding: 28px 22px 16px; font-family: 'Space Grotesk', sans-serif; font-size: 25px;
       font-weight: 600; letter-spacing: -0.01em;">设置</div>

  <div style="display: flex; flex-direction: column; gap: 14px; padding: 6px 22px 0;">

    <!-- SESSDATA card -->
    <div style="background: #15181f; border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; padding: 18px;">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;">
        <div style="font-size: 14px; font-weight: 600;">B 站 Cookie (SESSDATA)</div>
        <span style="font-size: 11px; padding: 3px 9px; border-radius: 999px;
             color: #34d3c0; background: rgba(52,211,192,0.12);">已设置</span>
      </div>
      <div style="font-size: 11.5px; color: #6b7585; line-height: 1.6; margin-bottom: 14px;">
        F12 → Application → Cookies → 复制 SESSDATA 的值。有效期约半年。</div>
      <div style="display: flex; gap: 10px;">
        <div style="flex: 1; padding: 11px 13px; background: #0c0e13; border: 1px solid rgba(255,255,255,0.08);
             border-radius: 13px; font-size: 13px; color: #4b535f;">粘贴 SESSDATA…</div>
        <button style="padding: 0 18px; border: none; border-radius: 13px; background: #34d3c0; color: #06251f;
             font-size: 13px; font-weight: 600;">保存</button>
      </div>
    </div>

    <!-- Columns slider -->
    <div style="background: #15181f; border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; padding: 18px;">
      <div style="font-size: 14px; font-weight: 600; margin-bottom: 16px;">每行显示数量</div>
      <div style="display: flex; align-items: center; gap: 14px;">
        <div style="flex: 1; height: 5px; border-radius: 999px; background: #262b34; position: relative;">
          <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 45%; border-radius: 999px; background: #34d3c0;"></div>
          <div style="position: absolute; left: 45%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px;
               border-radius: 50%; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.4);"></div>
        </div>
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 15px; width: 18px; text-align: center;">3</span>
      </div>
    </div>

    <!-- Sync card -->
    <div style="background: #15181f; border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; padding: 18px;">
      <div style="font-size: 14px; font-weight: 600; margin-bottom: 10px;">数据同步</div>
      <div style="font-size: 11.5px; color: #6b7585; line-height: 1.6; margin-bottom: 14px;">
        上次同步：<span style="color: #4ade80;">成功</span> · 9/2 03:07 · 更新 4 个视频</div>
      <button style="padding: 11px 22px; border: none; border-radius: 13px; background: #34d3c0; color: #06251f;
           font-size: 13px; font-weight: 600;">立即同步</button>
      <div style="margin-top: 10px; font-size: 11px; color: #4b535f;">定时任务每天 03:07 自动执行</div>
    </div>

    <!-- Completed accordion -->
    <div style="background: #15181f; border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; padding: 18px;
         display: flex; align-items: center; justify-content: space-between;">
      <div style="font-size: 14px; font-weight: 600;">已观看完视频</div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b7585" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </div>

    <div style="background: rgba(255,255,255,0.02); border-radius: 20px; padding: 16px 18px;
         font-size: 11px; color: #4b535f; line-height: 1.7;">
      Bili Progress PWA v1.0<br>进度以 B 站为准，名称与置顶以本地为准<br>进度 100% 持续 3 天后自动归档
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex;
       background: rgba(12,14,19,0.9); border-top: 1px solid rgba(255,255,255,0.06);
       backdrop-filter: blur(12px); padding: 12px 0 18px;">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #5b636f;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span style="font-size: 10.5px;">主页</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #34d3c0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      <span style="font-size: 10.5px;">设置</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
